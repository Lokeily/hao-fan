name: Build & Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check release metadata
        run: npm run check:version

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      # 生产依赖会打进发布产物，零容忍——有 high/critical 直接阻断发版。
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      # 开发工具链（wxt / eslint / typescript-eslint 等）只在本机构建时使用，
      # 不进任何发布产物，其漏洞不构成产品风险。这里仍然审计并保留可见告警，
      # 但不阻断发版——否则上游工具链的告警会让整个发布流程长期红灯。
      - name: Audit dev dependencies (non-blocking)
        run: npm audit --audit-level=high || echo "::warning::开发依赖存在告警级漏洞（不进构建产物，不阻塞发版，详见上方输出）"

      - name: Build extension
        run: npm run build

      - name: Run browser regression tests
        run: npm run test:browser

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Package zip
        run: npm run zip

      - name: Package Firefox zip
        run: npm run zip:firefox

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: haofan-extension
          path: .output/*.zip
          if-no-files-found: error
          include-hidden-files: true

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: haofan-extension
          path: .output

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .output/*.zip
          generate_release_notes: true
