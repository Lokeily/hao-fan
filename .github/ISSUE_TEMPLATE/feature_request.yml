name: 功能建议
description: 建议新的功能或使用体验改进
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请说明当前使用中遇到的困难，而不只是描述一个按钮或界面。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明期望的操作方式和最终结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方法
      description: 如果没有，可以填写“无”。
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已经搜索现有 Issues，没有找到相同建议。
          required: true
