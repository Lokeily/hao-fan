name: Bug 报告
description: 报告可以重复出现的功能或显示问题
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请勿提交 API Key、账号密码、Cookie 或其他敏感信息。
  - type: input
    id: extension-version
    attributes:
      label: 好翻版本
      placeholder: 例如 v0.1.14
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: 浏览器
      options:
        - Chrome
        - Edge
        - Firefox
        - 其他 Chromium 浏览器
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: 浏览器版本
      placeholder: 例如 Chrome 140
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 问题页面
      description: 可以公开访问时请填写网址，涉及隐私时请留空。
  - type: textarea
    id: description
    attributes:
      label: 问题说明
      description: 请说明实际发生了什么，以及你原本希望看到什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开某个页面
        2. 点击某个按钮
        3. 点击翻译
        4. 出现问题
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或错误信息
      description: 可以拖入截图。提交前请遮住所有敏感信息。
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已经删除 API Key、账号信息和其他敏感内容。
          required: true
        - label: 我已经搜索现有 Issues，没有找到相同问题。
          required: true
