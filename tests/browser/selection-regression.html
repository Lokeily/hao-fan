<!doctype html>
<html lang="en" data-batch-mode="mismatch">
  <head>
    <meta charset="UTF-8" />
    <title>Selection translation regression</title>
    <style>
      body { margin: 40px; font: 16px/1.6 system-ui; }
      main { max-width: 680px; }
      #controlled-panel { display: none; }
      #toggle-panel[aria-expanded="true"] + #controlled-panel { display: block; }
    </style>
    <script src="./browser-mock.js"></script>
  </head>
  <body>
    <main>
      <button id="create-selection" type="button">Create selection</button>
      <h1 id="selection-source">Enable two-factor authentication</h1>
      <p>The selection result should appear in an isolated popover without changing this paragraph.</p>
      <button id="toggle-panel" type="button" aria-controls="controlled-panel" aria-expanded="false">Toggle panel</button>
      <div id="controlled-panel"><p>Content revealed by aria-expanded</p></div>
      <aside id="side-navigation">
        <div id="close-control" role="button"><span>Close menu</span></div>
        <nav>
          <ul>
            <li>Home</li>
            <li>All issues</li>
            <li>All repositories</li>
          </ul>
        </nav>
      </aside>
    </main>
    <script>
      document.querySelector('#create-selection').addEventListener('click', () => {
        const range = document.createRange();
        range.selectNodeContents(document.querySelector('#selection-source'));
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        document.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
      });
      document.querySelector('#toggle-panel').addEventListener('click', (event) => {
        const button = event.currentTarget;
        button.setAttribute('aria-expanded', String(button.getAttribute('aria-expanded') !== 'true'));
      });
    </script>
    <script src="../../.output/chrome-mv3/content-scripts/content.js"></script>
  </body>
</html>
