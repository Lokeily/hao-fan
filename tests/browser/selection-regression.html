<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Selection translation regression</title>
    <style>
      body { margin: 40px; font: 16px/1.6 system-ui; }
      main { max-width: 680px; }
      #controlled-panel { display: none; }
      #toggle-panel[aria-expanded="true"] + #controlled-panel { display: block; }
    </style>
    <script>
      (() => {
        const eventTarget = { addListener() {}, removeListener() {} };
        const area = {
          async get() { return {}; },
          async set() {},
          async remove() {},
          async clear() {},
        };
        document.documentElement.dataset.translationCalls = '0';
        document.documentElement.dataset.singleRequests = '0';
        document.documentElement.dataset.activeSingles = '0';
        document.documentElement.dataset.maxActiveSingles = '0';
        globalThis.chrome = {
          runtime: {
            id: 'selection-regression',
            onMessage: eventTarget,
            async sendMessage(message) {
              document.documentElement.dataset.translationCalls = String(
                Number(document.documentElement.dataset.translationCalls || '0') + 1,
              );
              if (message?.type === 'TRANSLATE_ONE') {
                document.documentElement.dataset.singleRequests = String(
                  Number(document.documentElement.dataset.singleRequests || '0') + 1,
                );
                const active = Number(document.documentElement.dataset.activeSingles || '0') + 1;
                document.documentElement.dataset.activeSingles = String(active);
                document.documentElement.dataset.maxActiveSingles = String(Math.max(
                  active,
                  Number(document.documentElement.dataset.maxActiveSingles || '0'),
                ));
                await new Promise((resolve) => setTimeout(resolve, 20));
                document.documentElement.dataset.activeSingles = String(active - 1);
                const text = message.payload.text;
                return {
                  ok: true,
                  translation: text === 'Enable two-factor authentication'
                    ? '启用双重身份验证'
                    : `译文：${text}`,
                  stats: {},
                };
              }
              if (message?.type === 'TRANSLATE_BATCH') {
                // 故意返回错误数量，验证内容脚本的有限并发逐条兜底。
                return { ok: true, translations: [], stats: {} };
              }
              return { ok: true };
            },
          },
          storage: {
            local: area,
            session: area,
            sync: area,
            managed: area,
            onChanged: eventTarget,
          },
        };
      })();
    </script>
  </head>
  <body>
    <main>
      <button id="create-selection" type="button">Create selection</button>
      <h1 id="selection-source">Enable two-factor authentication</h1>
      <p>The selection result should appear in an isolated popover without changing this paragraph.</p>
      <button id="toggle-panel" type="button" aria-controls="controlled-panel" aria-expanded="false">Toggle panel</button>
      <div id="controlled-panel"><p>Content revealed by aria-expanded</p></div>
      <aside id="side-navigation">
        <div id="close-control" role="button"><span>Close menu</span></div>
        <nav>
          <ul>
            <li>Home</li>
            <li>All issues</li>
            <li>All repositories</li>
          </ul>
        </nav>
      </aside>
    </main>
    <script>
      document.querySelector('#create-selection').addEventListener('click', () => {
        const range = document.createRange();
        range.selectNodeContents(document.querySelector('#selection-source'));
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        document.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
      });
      document.querySelector('#toggle-panel').addEventListener('click', (event) => {
        const button = event.currentTarget;
        button.setAttribute('aria-expanded', String(button.getAttribute('aria-expanded') !== 'true'));
      });
    </script>
    <script src="../../.output/chrome-mv3/content-scripts/content.js"></script>
  </body>
</html>
