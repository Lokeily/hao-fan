<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>好翻 · 图片翻译</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --card: #ffffff;
        --text: #202124;
        --text-2: #5f6368;
        --sep: #dadce0;
        --accent: #1a73e8;
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
          "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      body {
        margin: 0;
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        min-height: 58px;
        padding: 10px 20px;
        background: var(--card);
        border-bottom: 1px solid var(--sep);
        display: flex;
        gap: 18px;
        align-items: center;
      }
      header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0; margin: 0; }
      header label { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 7px; cursor: pointer; }
      header label input { accent-color: var(--accent); width: 16px; height: 16px; }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 20px;
        width: min(100%, 1440px);
        margin: 0 auto;
        padding: 20px;
        align-items: flex-start;
      }
      .stage {
        min-width: 0;
        background: var(--card);
        border: 1px solid var(--sep);
        border-radius: 8px;
        padding: 12px;
      }
      .canvas { position: relative; min-width: 0; }
      .stage img { display: block; width: 100%; height: auto; border-radius: 4px; }
      .seg {
        position: absolute;
        box-sizing: border-box;
        border: 1px solid rgba(0, 113, 227, 0.75);
        background: rgba(255, 255, 255, 0.66);
        -webkit-backdrop-filter: blur(2px);
        backdrop-filter: blur(2px);
        color: #1d1d1f;
        font-size: 12px;
        line-height: 1.3;
        padding: 2px 4px;
        overflow: hidden;
        border-radius: 5px;
      }
      .seg.hide { display: none; }
      .list {
        min-width: 0;
        padding-left: 20px;
        border-left: 1px solid var(--sep);
        max-height: calc(100vh - 98px);
        overflow: auto;
        font-size: 13.5px;
      }
      .list .item { border-bottom: 1px solid var(--sep); padding: 10px 0; }
      .list .src { color: var(--text-2); }
      .list .dst { color: var(--text); margin-top: 3px; }
      .empty { padding: 40px; color: var(--text-2); }
      @media (max-width: 760px) {
        header { align-items: flex-start; flex-direction: column; gap: 8px; }
        main { grid-template-columns: 1fr; padding: 12px; }
        .list {
          max-height: none;
          padding: 14px 0 0;
          border-top: 1px solid var(--sep);
          border-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <script type="module" src="../src/pages/image-translate.ts"></script>
  </body>
</html>
